
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE QAMAR SHOP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #202b3c;
}

/* HEADER */

header {
  background: #172b4d;
  color: white;
  padding: 22px 14px;
  text-align: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 1px;
}

.tagline {
  font-size: 13px;
  margin: 8px 0 16px;
  color: #e0e7f2;
}

.search {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

/* PRODUCT SECTION */

.section-title {
  padding: 8px 14px;
  font-size: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 10px;
}

.item {
  background: white;
  border-radius: 11px;
  padding: 9px;
  box-shadow: 0 2px 9px #00000012;
  overflow: hidden;
}

.item img {
  width: 100%;
  height: 155px;
  object-fit: contain;
  border-radius: 7px;
  background: #fff;
}

.item h3 {
  font-size: 14px;
  margin: 9px 0;
  min-height: 32px;
}

.price {
  color: #e8660a;
  font-weight: bold;
  font-size: 17px;
  margin: 8px 0;
}

.buy {
  background: #ff6900;
  color: white;
  border: none;
  border-radius: 5px;
  padding: 9px 12px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

/* ORDER FORM */

#orderBox {
  display: none;
  background: white;
  margin: 12px;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 10px #00000012;
}

#orderBox h2 {
  font-size: 19px;
  color: #172b4d;
}

#selectedImage {
  width: 110px;
  height: 110px;
  object-fit: contain;
  display: block;
}

#orderBox input,
#orderBox textarea,
#orderBox select {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
}

.confirm {
  width: 100%;
  padding: 13px;
  background: #168447;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
}

.cancel {
  width: 100%;
  padding: 10px;
  margin-top: 7px;
  background: #eee;
  border: none;
  border-radius: 6px;
}

/* FOOTER */

footer {
  margin-top: 20px;
  background: #172b4d;
  color: white;
  text-align: center;
  padding: 22px 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>

  <div class="logo">THE QAMAR SHOP</div>

  <div class="tagline">
    Your Online Shopping Store
  </div>

  <input
    type="search"
    class="search"
    id="search"
    placeholder="Search Products..."
    oninput="searchProducts()">

</header>

<h2 class="section-title">Our Products</h2>

<div class="products" id="products"></div>

<!-- ORDER FORM -->

<div id="orderBox">

  <h2>Place Your Order</h2>

  <img id="selectedImage" alt="Product">

  <h3 id="productInfo"></h3>

  <input
    type="text"
    id="customer"
    placeholder="Your Full Name">

  <input
    type="tel"
    id="phone"
    placeholder="Your Mobile Number">

  <select id="size">
    <option value="">Select Size</option>
    <option>Medium</option>
    <option>Large</option>
    <option>XL</option>
    <option>XXL</option>
    <option>Not Applicable</option>
  </select>

  <textarea
    id="address"
    rows="3"
    placeholder="Complete Delivery Address">
  </textarea>

  <button class="confirm" onclick="sendOrder()">
    ORDER ON WHATSAPP
  </button>

  <button class="cancel" onclick="closeOrder()">
    Cancel
  </button>

</div>

<footer>

  <h3>THE QAMAR SHOP</h3>

  <p>Quality Products | Best Prices</p>

  <p>FREE HOME DELIVERY</p>

  <p>Thank You For Shopping With Us</p>

</footer>

<script>

/* ==================================
   YOUR PRODUCTS
   ADD NEW PRODUCTS IN THIS LIST
================================== */

const products = [

  {
    name: "Men Sandal",
    price: 1500,
    image: "IMAGES/Sandal.jpg"
  },

  {
    name: "Men Stylish Sandal",
    price: 1600,
    image: "IMAGES/Stylish.jpg"
  },
 
  {
    name: "Men Sandal",
    price: 3500,
    image: "IMAGES/shoes.jpg"
  },

  {
  name: "white cotton suit",
  price: 2000,
 image: "IMAGES/Cotton.jpg"
},

  {
    name: "2pc Men fleece plain Zipper Track Suit",
    price: 1950,
    image:"IMAGES/suit.jpg"
  }

  
];

/* DISPLAY PRODUCTS */

function showProducts(list) {

  const area = document.getElementById("products");

  area.innerHTML = "";

  if (list.length === 0) {
    area.innerHTML = "<p>No Products Found</p>";
    return;
  }

  list.forEach(function(product) {

    const card = document.createElement("div");
    card.className = "item";

    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name;

    img.onerror = function() {
      this.alt = "Image not found";
      this.style.background = "#f3f5f8";
    };

    const title = document.createElement("h3");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "Rs. " + product.price;

    const button = document.createElement("button");
    button.className = "buy";
    button.textContent = "BUY NOW";

    button.onclick = function() {
      order(product);
    };

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(price);
    card.appendChild(button);

    area.appendChild(card);

  });

}

/* SELECT PRODUCT */

let selectedProduct = null;

function order(product) {

  selectedProduct = product;

  document.getElementById("selectedImage").src =
    product.image;

  document.getElementById("productInfo").textContent =
    product.name + " - Rs. " + product.price;

  document.getElementById("orderBox").style.display =
    "block";

  document.getElementById("orderBox").scrollIntoView({
    behavior: "smooth"
  });

}

/* CLOSE ORDER */

function closeOrder() {

  document.getElementById("orderBox").style.display =
    "none";

}

/* SEND WHATSAPP ORDER */

function sendOrder() {

  const customer =
    document.getElementById("customer").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const size =
    document.getElementById("size").value;

  if (!selectedProduct) {
    alert("Please select a product");
    return;
  }

  if (!customer || !phone || !address) {
    alert("Please fill all required details");
    return;
  }

  if (!/^[0-9+\-\s]{7,20}$/.test(phone)) {
    alert("Please enter a valid phone number");
    return;
  }

  const message =
    "NEW ORDER - THE QAMAR SHOP\n\n" +
    "Product: " + selectedProduct.name + "\n" +
    "Price: Rs. " + selectedProduct.price + "\n" +
    "Size: " + (size || "Not selected") + "\n\n" +
    "Customer: " + customer + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address;

  const whatsappURL =
    "https://wa.me/923121309011?text=" +
    encodeURIComponent(message);

  window.location.href = whatsappURL;

}

/* SEARCH PRODUCTS */

function searchProducts() {

  const value =
    document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(function(product) {

    return product.name.toLowerCase().includes(value);

  });

  showProducts(filtered);

}

/* START WEBSITE */

showProducts(products);

</script>

</body>
</html>
